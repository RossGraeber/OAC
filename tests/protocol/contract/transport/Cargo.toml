# SPDX-License-Identifier: Apache-2.0
#
# tests/protocol/contract/transport/: the transport contract suite (#59, F10). One suite,
# written against `dyn oac_core::transport::Transport` (spec/interfaces.md section 6), that
# every transport runs unchanged with a harness of its own (now, advance, settle, optional
# fault control). Test-only: a transport takes it as a dev-dependency, never a normal or
# build one, so it is never built into the `oac` binary (scripts/check-crate-deps.mjs,
# `tests/protocol/contract/<name>` kind; 07 sections 1-3). It depends on core/ only, and on
# nothing outside the Rust standard library.

[package]
name = "oac-contract-transport"
description = "Transport contract suite for OAC transports (test-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oac-core.workspace = true
