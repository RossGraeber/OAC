# SPDX-License-Identifier: Apache-2.0
#
# tests/protocol/contract/adapter/: the adapter contract suite (#59, F10). One suite,
# written against `dyn oac_core::adapter::ProviderAdapter` (spec/interfaces.md section 5),
# that every adapter runs unchanged against the fake harnesses: the fake Claude Code
# channel endpoint (tests/fakes/claude, in process) and the fake Codex app-server
# (tests/fakes/codex-app-server, spawned with `node` on loopback). Test-only: an adapter
# takes it as a dev-dependency, never a normal or build one, so it is never built into the
# `oac` binary (scripts/check-crate-deps.mjs, `tests/protocol/contract/<name>` kind; 07
# sections 1-3). It depends on core/ and the fake Claude endpoint only, and on nothing
# outside the Rust standard library.

[package]
name = "oac-contract-adapter"
description = "Adapter contract suite for OAC provider adapters, run against the fake harnesses (test-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oac-core.workspace = true
oac-fake-claude = { path = "../../../fakes/claude" }
