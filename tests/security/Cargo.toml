# SPDX-License-Identifier: Apache-2.0
#
# tests/security/: the security suite against the fakes (#60, F11). Each test proves one
# threat-table mitigation (docs/planning/v0.1/06-security.md section 14; spec/security.md
# section 13) by driving the real core: envelope validation, the security stage in Table 7.1
# order, authorization, the duplicate store, presence and receipt authentication, pairing
# and key removal. Envelopes cross the in-memory transport where the threat is on the
# carrying path, and the fake Claude Code endpoint shows what a harness renders. CI-default:
# no live provider, no API key, no network beyond loopback (09 section 3).
#
# Test-only, and a leaf: it depends on core/, the fake Claude endpoint and the in-memory
# transport, and nothing may depend on it (scripts/check-crate-deps.mjs, `tests/security`
# kind; 07 sections 1-3). No third-party crate.

[package]
name = "oac-security-suite"
description = "Security suite for OAC, run against the core, the fakes and the in-memory transport (test-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oac-core.workspace = true
oac-fake-claude = { path = "../fakes/claude" }
oac-transport-memory = { path = "../../transports/memory" }
