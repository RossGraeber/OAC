# SPDX-License-Identifier: Apache-2.0
#
# tests/security/: the security suite against the fakes (#60, F11). Each test proves one
# threat-table mitigation (docs/planning/v0.1/06-security.md section 14; spec/security.md
# section 13) by driving the real core: envelope validation, the security stage in Table 7.1
# order, authorization, the duplicate store, presence and receipt authentication, pairing
# and key removal. Envelopes cross the in-memory transport where the threat is on the
# carrying path, and the fake Claude Code endpoint shows what a harness renders. CI-default:
# no live provider, no API key, no network beyond loopback (09 section 3).
#
# Test-only, and a leaf: it depends on core/, the fake Claude endpoint and the in-memory
# transport, and nothing may depend on it (scripts/check-crate-deps.mjs, `tests/security`
# kind; 07 sections 1-3). Its one third-party crate is `syn`, a test-only dev-dependency
# already in the graph. Its tests also take the Claude adapter as a dev-dependency (#65).

[package]
name = "oac-security-suite"
description = "Security suite for OAC, run against the core, the fakes and the in-memory transport (test-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No doc-tests (#329): neither the static threat map nor check-compiled-tests.mjs's listing
# sees one, so a doc-test could never count as a proof. tests/threat_map.rs checks this
# setting, and that no target here sets a test harness of its own.
[lib]
doctest = false

[dependencies]
oac-core.workspace = true
oac-fake-claude = { path = "../fakes/claude" }
oac-transport-memory = { path = "../../transports/memory" }

[dev-dependencies]
# The Claude adapter (G4, #65), as a dev-dependency only (scripts/check-crate-deps.mjs rule
# 5): the adapter's own mitigations for 06 rows 11, 15 and 16 run in tests/provenance.rs,
# driving it through the fake Claude Code endpoint.
oac-adapter-claude = { path = "../../adapters/claude" }
# Parses the suite's own test sources, and core's, for tests/threat_map.rs (#60 review N4).
# MIT OR Apache-2.0, already in the graph at this version for the adapter contract suite
# (07 section 5).
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
