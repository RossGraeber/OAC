#
# tests/fakes/claude/: the fake Claude Code channel endpoint (#57, F8). A test double of
# the harness side of the Claude channel path, replayed from the recorded Stage 1 fixtures
# under docs/planning/gates/fixtures/. Test-only: it is never a normal or build dependency
# of a product crate, so it is never compiled into the `oac` binary. A product crate may
# take it as a dev-dependency only (scripts/check-crate-deps.mjs, `tests/fakes/<name>`
# kind; 07 sections 1-3). It depends on core/ only, for the order-preserving JSON reader,
# and on nothing outside the Rust standard library.

[package]
name = "oac-fake-claude"
description = "Fake Claude Code channel endpoint replayed from recorded fixtures (test double)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oac-core.workspace = true
