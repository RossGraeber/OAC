# SPDX-License-Identifier: Apache-2.0
#
# transports/zenoh/: the reference transport. Depends on core/ only; every Zenoh type stays
# inside this crate (07 sections 3 and 4a; scripts/check-crate-deps.mjs).

[package]
name = "oac-transport-zenoh"
description = "OAC reference transport over Zenoh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oac-core.workspace = true
# zenoh 1.10.1 (docs/planning/PINS.md), dual EPL-2.0 OR Apache-2.0: OAC elects Apache-2.0
# (C1 section 7, C7 section 8). Stable API only: no `unstable`, no `shared-memory`. Default
# features off; `transport_tcp` is the one link this transport opens (C7 section 5: a
# loopback TCP rendezvous; scouting is off in local mode). TLS is G3's (#64).
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tcp"] }
# Hashes configured partition labels and receiver-local opaque stream handles. Already in the graph
# at this version through core/.
sha2 = "=0.11.0"

[features]
# Test support only: native identifier snapshots and raw sample-boundary carriage captures.
# Captures retain synthetic frame bytes without a memory bound; never enable in product use.
# Off by default; this crate's own tests turn it on through the
# dev-dependency below. A dependent that turned it on explicitly would gain nothing that
# crosses the boundary: the method exists only on the concrete `PeerTransport`, which only
# cli/ constructs (the core holds a `dyn Transport` and cannot call it), and it returns this
# process's own peer ids, configured endpoints and key prefix plus synthetic sample bytes.
# It feeds no health detail or error (IFC-TYP-092). Turning it on in a
# product crate is still a review finding.
test-support = []

[dev-dependencies]
oac-contract-transport = { path = "../../tests/protocol/contract/transport" }
oac-transport-zenoh = { path = ".", features = ["test-support"] }
