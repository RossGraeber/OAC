# SPDX-License-Identifier: Apache-2.0
#
# transports/memory/: the in-memory transport (#56, F7). A loopback implementation of the
# transport contract (spec/interfaces.md section 6) with fault injection, for every
# CI-default test. Depends on core/ only (07 section 3; scripts/check-crate-deps.mjs), and
# on nothing outside the Rust standard library. Its tests run the shared transport contract
# suite (#59, F10), a test-only dev-dependency that is never built into the `oac` binary.

[package]
name = "oac-transport-memory"
description = "OAC in-memory transport, with fault injection for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oac-core.workspace = true

[dev-dependencies]
oac-contract-transport = { path = "../../tests/protocol/contract/transport" }
