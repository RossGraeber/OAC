# SPDX-License-Identifier: Apache-2.0
#
# adapters/codex/: depends on core/ and adapters/mcp-tools only. Never on another adapter, a
# transport, or cli/ (07 section 3; scripts/check-crate-deps.mjs).

[package]
name = "oac-adapter-codex"
description = "OAC provider adapter for the Codex App Server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No doctests: they build with the dev-dependencies, so one could hold a contract-suite
# harness outside tests/contract.rs (tests/protocol/contract/adapter/tests/harness_location.rs).
[lib]
doctest = false

[dependencies]
oac-core.workspace = true
oac-mcp-tools.workspace = true
# rmcp and tokio are the vetted MCP server side (G-7 sections 3.1 and 5), as in
# adapters/claude/Cargo.toml: rmcp pinned exactly, default features off, `server` and
# `transport-async-rw` only, never `macros`; tokio pinned exactly, with only features rmcp
# itself turns on (no `net`, `process`, `fs`). The adapter static scan vets each line by
# identity, pin and features (tests/protocol/contract/adapter/src/source.rs
# VETTED_DEPENDENCIES).
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-async-rw"] }
tokio = { version = "=1.53.2", features = ["rt", "sync", "io-util", "time"] }
