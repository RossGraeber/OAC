# SPDX-License-Identifier: Apache-2.0
#
# adapters/claude/: depends on core/ only. Never on another adapter, a transport, or cli/
# (07 section 3; scripts/check-crate-deps.mjs).

[package]
name = "oac-adapter-claude"
description = "OAC provider adapter for Claude Code Channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No doctests: they build with the dev-dependencies, so one could hold a contract-suite
# harness outside tests/contract.rs (tests/protocol/contract/adapter/tests/harness_location.rs).
[lib]
doctest = false

[dependencies]
oac-core.workspace = true
