# Device-key stores against real credential stores (#52, F3): Windows Credential Manager,
# macOS Keychain, the Linux Secret Service, and the encrypted-file fallback on a headless
# Linux host (cli/src/keystore.rs; docs/planning/decisions/C4-session-identity.md
# sections 10-11).
#
# Opt-in, NOT the default CI tier (oac-testing section 2): it starts only by manual
# dispatch. The tests it runs are #[ignore]d and need OAC_TEST_REAL_KEYRING=1, so a default
# `cargo test` never touches a credential store. Each test writes and deletes an entry of
# OAC's own under the service io.github.rossgraeber.oac.test, never the device key's entry
# and never a harness's credentials (C4 section 12).
#
# No secrets. Permissions contents: read; checkout does not persist the job token. The
# Secret Service job unlocks a throwaway keyring with a throwaway password in a private
# session bus that ends with the step.
name: keystore-optin

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  os-credential-store:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out (no persisted token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          set -eu
          rustup toolchain install
          rustc --version | grep -q '^rustc 1\.98\.1 ' || { echo "toolchain is not the 1.98.1 pin"; exit 1; }

      - name: Real credential store round trip (opt-in test)
        shell: bash
        env:
          OAC_TEST_REAL_KEYRING: "1"
        run: cargo test -p oac-cli --locked real_credential_store_round_trip -- --ignored --nocapture

  linux-secret-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out (no persisted token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          set -eu
          rustup toolchain install
          rustc --version | grep -q '^rustc 1\.98\.1 ' || { echo "toolchain is not the 1.98.1 pin"; exit 1; }

      - name: Install a Secret Service provider (gnome-keyring) and a session bus
        run: sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring dbus-x11

      - name: Build the test first, outside the session bus
        run: cargo test -p oac-cli --locked --no-run

      - name: Real Secret Service round trip (opt-in test)
        env:
          OAC_TEST_REAL_KEYRING: "1"
        run: |
          dbus-run-session -- sh -c '
            printf "throwaway" | gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
            cargo test -p oac-cli --locked real_credential_store_round_trip -- --ignored --nocapture'

  linux-headless-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out (no persisted token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          set -eu
          rustup toolchain install
          rustc --version | grep -q '^rustc 1\.98\.1 ' || { echo "toolchain is not the 1.98.1 pin"; exit 1; }

      - name: Headless fallback to the encrypted file (opt-in test, no session bus)
        env:
          OAC_TEST_REAL_KEYRING: "1"
        run: |
          env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR \
            cargo test -p oac-cli --locked headless_linux_falls_back_to_the_encrypted_file -- --ignored --nocapture
