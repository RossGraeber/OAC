# ADR-001 boundary lint: the scripted/CI-safe subset of
# .claude/skills/oac-boundaries/references/mechanical-checks.md (checks 1, 2, 3, 8, 9, 10, 11),
# plus the zero-hits group of
# .claude/skills/oac-spec-authoring/references/neutral-vocabulary-check.md over spec/.
# Those files are the source of truth for every check; if a command changes there, change it
# here too. Checks 1-2 run over spec/ (mandatory since #41: a missing spec/ fails) and over
# core/ once it exists. Checks 4-7 stay manual.
# The containment job (#61, F12) runs checks 12 and 13 (scripts/check-containment.mjs):
# Zenoh containment over every product path, the fakes, the contract suites and the
# fixtures (DESIGN acceptance criterion 9), and test doubles kept out of product code.
# The workflow-policy job (#61) runs scripts/check-workflows.mjs over every workflow:
# actions pinned by commit SHA, permissions contents: read, no persisted checkout token, no
# secrets or provider credentials anywhere, and no opt-in switch, operator-owned runner or
# harness CLI in a default-tier workflow.
# The fixture-manifest job (#142) and the agents-skills-sync job (#235) are not boundary
# checks; they share this file's triggers, permissions and pinned checkout, and need git
# and Node only. The test tiers, conformance runner and fake Codex self-test included, are
# ci.yml's (#61).
name: boundary-lint

# Pull requests, plus pushes to main, so each PR runs every job once, not twice (as ci.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boundary-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks 9-10 self-test (each planted violation must fail)
        run: node scripts/check-herdr-containment.mjs --self-test

      - name: Checks 9-10 herdr containment (PENDING exits 0 but is not a pass)
        run: node scripts/check-herdr-containment.mjs

      - name: Install ripgrep
        run: command -v rg || (sudo apt-get update -q && sudo apt-get install -y -q ripgrep)

      # rg exit 1 = zero hits (pass); exit 0 = hits (fail); exit 2 = error (fail).
      # --no-ignore: a committed .ignore/.rgignore/.gitignore must not switch a check off.
      - name: Check 3 - no provider SDK imports or deps in the code tree
        run: |
          set +e
          rg -n --no-ignore --glob '!target' --glob '!docs/**' -i \
            '\bopenai\b|\banthropic\b|@anthropic-ai|from openai|import openai' \
            --glob '*.rs' --glob '*.py' --glob '*.ts' --glob '*.toml' \
            --glob '*.js' --glob '*.mjs' --glob '*.go' --glob '*.json' .
          status=$?
          [ "$status" -eq 1 ] && { echo "check 3 clean"; exit 0; }
          echo "check 3 failed (rg exit $status): stop and cite the boundary (oac-boundaries)"
          exit 1

      - name: Check 8 - no separately administered server for local use
        run: |
          set +e
          rg -n --no-ignore -i --glob '!docs/**' 'dockerfile|docker-compose|kubernetes|helm|zenohd' .
          status=$?
          [ "$status" -eq 1 ] && { echo "check 8 clean"; exit 0; }
          echo "check 8 failed (rg exit $status): stop and cite the boundary (oac-boundaries)"
          exit 1

      # Checks 1-2 over spec/ (mandatory: missing fails) and core/ (once it exists), then the
      # spec neutral-vocabulary zero-hits group over spec/. The files are listed explicitly
      # with find (every regular file, dot-files and ignored files included), so no ignore
      # file, glob or directory name can drop one. Check 2 and the zero-hits group exempt
      # exactly one regular file, spec/bindings/mcp.md (the task E6 binding document); check 1
      # exempts nothing. A symlink under spec/, or a non-regular spec/bindings/mcp.md, fails.
      - name: Checks 1-2 and spec neutral vocabulary - no transport or provider names in spec/ core/
        run: |
          set +e
          binding=spec/bindings/mcp.md
          if [ ! -d spec ] || [ -L spec ]; then echo "checks 1-2 failed: spec/ is missing or not a directory (mandatory since #41)"; exit 1; fi
          if [ ! -f spec/session-channels.md ] || [ -L spec/session-channels.md ]; then echo "checks 1-2 failed: spec/session-channels.md is missing or not a regular file"; exit 1; fi
          if { [ -e "$binding" ] || [ -L "$binding" ]; } && { [ -L "$binding" ] || [ ! -f "$binding" ]; }; then
            echo "checks 1-2 failed: $binding exists but is not a regular file"; exit 1
          fi
          links=$(find spec -type l)
          if [ -n "$links" ]; then echo "checks 1-2 failed: symlink under spec/:"; echo "$links"; exit 1; fi
          mapfile -d '' spec_all < <(find spec -type f -print0)
          spec_neutral=()
          for f in "${spec_all[@]}"; do [ "$f" = "$binding" ] || spec_neutral+=("$f"); done
          core_all=()
          [ -d core ] && mapfile -d '' core_all < <(find core -type f -not -path '*/target/*' -print0)
          fail=0
          rg -n --hidden --no-ignore -i '\bzenoh\b|\bzid\b|key[_-]?expr|liveliness' -- "${spec_all[@]}" "${core_all[@]}"
          s=$?; [ "$s" -eq 1 ] || { echo "check 1 failed (rg exit $s)"; fail=1; }
          rg -n --hidden --no-ignore \
            'claude/channel|thread/queue/add|turn/steer|turn/start|thread/start|thread/resume|notifications/claude/channel' \
            -- "${spec_neutral[@]}" "${core_all[@]}"
          s=$?; [ "$s" -eq 1 ] || { echo "check 2 failed (rg exit $s)"; fail=1; }
          rg -n --hidden --no-ignore -i \
            '\bzenoh\b|\bzid\b|key[_-]?expr|liveliness|scouting|\bmqtt\b|\bnats\b|\bclaude\b|\bcodex\b|app[ -]server|claude/channel|--channels|--dangerously-load-development-channels|thread/(queue/add|start|resume|loaded/list)|turn/(steer|start)|tools/call|prompts/get|resources/read|notifications/[a-z]+/' \
            -- "${spec_neutral[@]}"
          s=$?; [ "$s" -eq 1 ] || { echo "spec neutral-vocabulary check failed (rg exit $s)"; fail=1; }
          [ "$fail" -eq 0 ] && { echo "checks 1-2 and spec neutral vocabulary clean (${#spec_all[@]} spec/ files, ${#core_all[@]} core/ files)"; exit 0; }
          echo "stop and cite the boundary (oac-boundaries, oac-spec-authoring section 3)"
          exit 1

      # Scans git-tracked files only (what CI sees). No tracked files under the product
      # paths prints PENDING and exits 0 -- pending is not a pass. Hits in a tracked path
      # name or in file content fail.
      - name: Check 11 - no Beacon in product paths
        run: |
          set +e
          pattern='\bbeacon\b|beacon_|beacon-managed|agent-beacon|asymptote-labs|memory\.db|get_memory_context|search_memory|get_memory\b'
          mapfile -d '' files < <(git ls-files -z -- adapters core cli transports spec Cargo.toml Cargo.lock)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "check 11 PENDING: no tracked files under adapters/ core/ cli/ transports/ spec/ or root Cargo manifests"
            exit 0
          fi
          printf '%s\n' "${files[@]}" | rg -n -i -e "$pattern"
          pstatus=$?
          rg -H -n -i -e "$pattern" -- "${files[@]}"
          status=$?
          [ "$pstatus" -eq 1 ] && [ "$status" -eq 1 ] && { echo "check 11 clean (${#files[@]} tracked files)"; exit 0; }
          echo "check 11 failed (rg exit $pstatus/$status): stop and cite the boundary (oac-boundaries)"
          exit 1

  fixture-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history (#252): a verified herdr-runs record's expected herdr sha256 is
          # checked against PINS.md at the run's driver commit, which a shallow clone lacks.
          fetch-depth: 0

      - name: Fixture manifest self-test (each planted violation must fail)
        run: node scripts/check-fixture-manifest.mjs --self-test

      - name: Fixture manifest check (MANIFEST.json matches committed fixtures)
        run: node scripts/check-fixture-manifest.mjs

  # Checks 12-13 (#61, F12): a build-failing lint over the git index. Zenoh containment
  # proves DESIGN acceptance criterion 9 (09 section 8); test-double containment is the
  # check 9 sibling for tests/fakes/ and tests/protocol/contract/ (PR #318 review item 9).
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out (no persisted token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks 12-13 self-test (each planted violation must fail)
        run: node scripts/check-containment.mjs --self-test

      - name: Check 12 Zenoh containment and check 13 test-double containment
        run: node scripts/check-containment.mjs

  # The default tier uses no live provider, no API key and no network beyond loopback
  # (#61, F12 acceptance 1); every workflow keeps SHA pins, read-only permissions and no
  # persisted token.
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out (no persisted token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow policy self-test (each planted violation must fail)
        run: node scripts/check-workflows.mjs --self-test

      - name: Workflow policy (default tier has no secrets, provider or opt-in switch)
        run: node scripts/check-workflows.mjs

  # Not a boundary check either (#235): the Codex copy (.agents/skills/, AGENTS.md) must be
  # an unmodified mirror of .claude/skills/ and CLAUDE.md. Node only, no secrets.
  agents-skills-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Codex skills copy self-test (each planted drift must fail)
        run: node scripts/sync-agents-skills.mjs --self-test

      - name: Codex skills copy matches its source
        run: node scripts/sync-agents-skills.mjs --check

      # oac-authoring-skills budgets (lines, description length), run by hand until #61.
      - name: Skill budgets
        run: node scripts/check-skills.mjs
